<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#EDF0EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18231F" media="(prefers-color-scheme: dark)">
<script>
/* A kiválasztott megjelenés (világos/sötét) már az első rajzolás előtt érvényes legyen. */
try {
  var mt = localStorage.getItem("masnaplo-theme");
  if (mt === "light" || mt === "dark") {
    document.documentElement.setAttribute("data-theme", mt);
    var tc = mt === "dark" ? "#18231F" : "#EDF0EA";
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute("content", tc); });
  }
} catch (e) {}
</script>
<meta name="description" content="Másnapló – Ami tegnap még jó ötletnek tűnt. Napi ivásnapló és buli számláló barátoknak.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Másnapló">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/masnaplo-192.png">
<link rel="apple-touch-icon" href="icons/masnaplo-apple-180.png">
<title>Másnapló</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EDF0EA;
  --surface: #FBFCF9;
  --surface-2: #E1E6DE;
  --ink: #17221D;
  --ink-soft: #56635C;
  --line: #CAD3CB;
  --shot: #B8620F;
  --wine: #9E2547;
  --beer: #8F6D00;
  --water: #22739A;
  --btn-ink: #FFFFFF;
  --danger: #A3261F;
  --focus: #22739A;
  --scrim: rgba(12, 20, 16, .5);
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18231F;
    --surface: #212E29;
    --surface-2: #2A3933;
    --ink: #ECEDE4;
    --ink-soft: #A3AFA8;
    --line: #34443D;
    --shot: #F2A24E;
    --wine: #EE7896;
    --beer: #F0CB4F;
    --water: #6BC0E3;
    --btn-ink: #18231F;
    --danger: #FF8A80;
    --focus: #6BC0E3;
    --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18231F;
  --surface: #212E29;
  --surface-2: #2A3933;
  --ink: #ECEDE4;
  --ink-soft: #A3AFA8;
  --line: #34443D;
  --shot: #F2A24E;
  --wine: #EE7896;
  --beer: #F0CB4F;
  --water: #6BC0E3;
  --btn-ink: #18231F;
  --danger: #FF8A80;
  --focus: #6BC0E3;
  --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 17px/1.45 "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body.locked { overflow: hidden; }
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
button { font-family: inherit; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.cond { font-family: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif; }
.small { font-size: 14px; }

/* Fejléc */
.top { background: var(--bg); }
.top-inner { max-width: 560px; margin: 0 auto; padding: 10px 16px 10px; }
.brand-row { display: flex; align-items: center; gap: 8px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand svg { display: block; flex: none; }
.brand-text { display: flex; flex-direction: column; min-width: 0; gap: 3px; }
.brand-name { margin: 0; font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: .07em; }
.brand-tag { font-style: italic; font-size: 14px; line-height: 1.25; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  border-radius: 12px; border: 1.5px solid var(--line);
  background: transparent; color: var(--ink); cursor: pointer;
}
.ico { display: grid; place-items: center; flex: none; }

main { max-width: 560px; margin: 0 auto; padding: 18px 16px 120px; }

.banner { margin: 0 0 16px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); font-size: 15px; }
.banner.row { display: flex; align-items: center; gap: 10px; }
.banner.row span { flex: 1; min-width: 0; }
.banner .btn { min-height: 40px; padding: 0 14px; font-size: 15px; }
.banner .del { width: 32px; height: 32px; }
.muted { color: var(--ink-soft); }
.code { font-weight: 700; letter-spacing: .02em; overflow-wrap: anywhere; }
.top-actions { display: flex; gap: 10px; margin: 0 0 20px; }

/* Egy ember lapja */
.p-head { display: flex; align-items: flex-start; gap: 14px; margin: 2px 0 18px; }
.p-head-text { flex: 1; min-width: 0; }
.p-head h2 { margin: 0; font-weight: 700; font-size: 40px; line-height: 1.05; overflow-wrap: anywhere; }
.p-head p { margin: 4px 0 0; color: var(--ink-soft); }
.p-head .p-score { margin-top: 8px; }
.score-num { font-weight: 700; font-size: 28px; line-height: 1; color: var(--ink); }

.cat {
  display: grid; grid-template-columns: minmax(0, 1fr); align-items: center;
  margin-bottom: 12px; padding: 6px 10px 6px 4px;
  background: var(--surface);
  border: 1px solid var(--line); border-left: 6px solid var(--c);
  border-radius: 20px;
}
.cat.quiet { background: transparent; border-style: dashed; border-left-style: solid; }
.cat-open {
  display: grid; min-width: 0;
  grid-template-columns: 1fr auto;
  grid-template-areas: "title num" "tally num" "hint vol";
  column-gap: 10px; row-gap: 6px; align-items: center;
  padding: 10px 6px 10px 12px;
  background: none; border: 0; border-radius: 14px;
  color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.cat-title { grid-area: title; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 20px; line-height: 1.1; min-width: 0; }
.cat-title .cat-big svg { width: 28px; height: 28px; }
.cat-num { grid-area: num; align-self: center; justify-self: end; font-weight: 700; font-size: 54px; line-height: .9; color: var(--c); font-variant-numeric: tabular-nums; }
.cat-vol { grid-area: vol; justify-self: end; font-size: 14px; color: var(--ink-soft); white-space: nowrap; }
.tally { grid-area: tally; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; min-height: 28px; color: var(--c); }
.tally svg { display: block; overflow: visible; }
.tally line { stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
.tally-empty { font-size: 15px; color: var(--ink-soft); }
.tally-more { font-weight: 700; font-size: 20px; }
.cat-hint { grid-area: hint; font-size: 14px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.help { font-size: 15px; color: var(--ink-soft); margin: 14px 2px 0; }
.fresh { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* Hányás-szavazás */
.vomit {
  --c: var(--wine);
  margin: 24px 0 0; padding: 14px;
  border-radius: 18px; background: var(--surface); border: 1px solid var(--line);
}
.vomit .feed-title { margin-bottom: 10px; }
.vote-row { display: flex; gap: 10px; }
.vote-btn {
  flex: 1; min-height: 50px; border-radius: 14px;
  border: 1.5px solid var(--line); background: transparent; color: var(--ink);
  font-weight: 600; font-size: 17px; cursor: pointer;
}
.vote-btn.yes[aria-pressed="true"] { background: var(--wine); border-color: var(--wine); color: var(--btn-ink); }
.vote-btn.no[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.vote-tally { margin: 10px 0 0; font-size: 15px; color: var(--ink-soft); }
.vote-result { margin: 10px 0 0; font-weight: 600; }
.vote-result.bad { color: var(--wine); }
.stepper-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
.lbl-inline { font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 8px; }

/* Verseny */
.rank-list { list-style: none; margin: 0; padding: 0; }
.rank-row {
  display: flex; align-items: center; gap: 10px;
  width: 100%; min-height: 66px; padding: 10px 2px;
  background: none; border: 0; border-bottom: 1px solid var(--line);
  color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.rank-no { flex: none; width: 2.4ch; text-align: right; font-weight: 700; font-size: 24px; color: var(--ink-soft); }
.rank-row.first-place .rank-no { color: var(--beer); }
.rank-pts { flex: none; display: flex; flex-direction: column; align-items: flex-end; }
.rank-pts .cond { font-weight: 700; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.rank-unit { font-size: 12px; color: var(--ink-soft); }
.rules-note { margin: 8px 2px 24px; font-size: 14px; color: var(--ink-soft); }
.p-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.p-name { font-weight: 600; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-sub { font-size: 14px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc { display: flex; flex-direction: column; align-items: center; min-width: 26px; color: var(--c); }
.pc .e svg { width: 20px; height: 20px; }
.pc .e { margin-bottom: 1px; }
.pc .n { font-weight: 700; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
.view-title { margin: 0 0 6px; font-weight: 700; font-size: 34px; line-height: 1.05; }
.feed-title { margin: 0 0 6px; font-weight: 700; font-size: 26px; line-height: 1.1; }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.f-who { font-weight: 600; }
/* Ital-ikonok (vektorgrafika) */
.cat-ico { display: inline-grid; place-items: center; flex: none; line-height: 0; }
.cat-ico svg { display: block; width: 1.25em; height: 1.25em; }
.cnts { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 11px; white-space: normal; overflow: visible; }
.cnt { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.cnt .cat-ico svg { width: 18px; height: 18px; }
.f-what { display: inline-flex; align-items: center; gap: 4px; }
.drinks-feed li { align-items: center; }
.f-what .cat-ico svg { width: 20px; height: 20px; }
.pick-name { display: inline-flex; align-items: center; gap: 8px; }
.pick-ico svg { width: 24px; height: 24px; }
.title-ico { display: inline-grid; vertical-align: -3px; margin-right: 8px; }
.title-ico svg { width: 32px; height: 32px; }
.f-when { margin-left: auto; color: var(--ink-soft); font-size: 14px; white-space: nowrap; }

/* Statisztika */
.stats { margin: 26px 0 8px; }
.stats.first { margin: 0 0 22px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-grid.one { grid-template-columns: 1fr; }
.stat { display: flex; flex-direction: column; min-width: 0; padding: 14px 12px 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.stat-title { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat-num { font-weight: 700; font-size: 48px; line-height: 1; margin-top: 6px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat-sub { font-size: 14px; color: var(--ink-soft); }
.stat-cats { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 4px; margin-top: 12px; }
.stat-cats .n { font-size: 19px; }
.stat-note { margin: 8px 2px 0; font-size: 14px; color: var(--ink-soft); }

/* Grafikon */
.chart-box { padding: 12px 8px 12px 4px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.chart-empty { margin: 8px 10px; }
.chart { display: flex; align-items: stretch; }
.chart-axis { flex: none; display: block; }
.chart-axis text, .chart-plot text { fill: var(--ink-soft); font: 500 11px "Barlow", system-ui, sans-serif; }
.chart-scroll { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
.chart-inner { position: relative; min-width: 100%; }
.chart-plot { display: block; overflow: hidden; }
.chart-grid { stroke: var(--line); stroke-width: 1; }
.chart-base { stroke: var(--ink-soft); stroke-width: 1; }
.chart-seg { stroke: var(--surface); stroke-width: 1; cursor: pointer; }
.chart-seg:focus { outline: none; }
.chart-seg:focus-visible { stroke: var(--ink); stroke-width: 2.5; }
.chart-tip {
  position: absolute; z-index: 2; width: 156px;
  display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: center;
  padding: 8px 10px; border-radius: 12px;
  background: var(--ink); color: var(--bg);
  box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
  font-size: 14px; line-height: 1.3; pointer-events: none;
}
.tip-dot { grid-row: span 2; width: 12px; height: 12px; border-radius: 3px; }
.tip-main { font-weight: 700; }
.tip-sub { font-size: 12px; opacity: .85; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 4px 0 10px; font-size: 13px; color: var(--ink-soft); }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }

/* Belépés, csatlakozás */
.onboard { padding-top: 6px; }
.hero-tally { margin: 0 0 14px; }
.hero-mark { display: block; margin: 0 0 18px; border-radius: 22px; }
.hero-mark .echo { animation: echo .7s cubic-bezier(.2, .8, .2, 1) .15s both; }
@keyframes echo { from { transform: translate(-20px, -20px); } }
.hero-tally line { stroke-width: 7; stroke-linecap: round; }
.hero-tally line.draw { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw .45s ease-out forwards; }
.hero { margin: 0 0 10px; font-weight: 700; font-size: 56px; line-height: .95; }
.lead { margin: 0 0 20px; font-size: 18px; max-width: 34em; }
.note { margin: 0 0 18px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); }
.msg { min-height: 1.4em; margin: 10px 0 0; color: var(--ink-soft); font-size: 15px; }
.msg.err { color: var(--danger); }
.sheet .msg:empty { min-height: 0; margin: -6px 0 0; }
.hint { margin: -4px 0 0; font-size: 14px; color: var(--ink-soft); }
.hint.spaced { margin-top: 6px; }
.party-hint { margin: -4px 0 0; font-weight: 600; }
.party-hint:empty { display: none; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
.auth .seg { margin: 0 0 18px; }
.seg-btn {
  flex: 1; min-height: 44px; border: 0; border-radius: 10px;
  background: transparent; color: var(--ink-soft);
  font-weight: 600; font-size: 16px; cursor: pointer;
}
.seg-btn[aria-checked="true"], .seg-btn[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
.pw-checks { list-style: none; margin: -4px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 14px; color: var(--ink-soft); }
.pw-checks li { display: flex; align-items: center; gap: 6px; }
.pw-checks li.ok { color: var(--ink); }
.pw-checks .ck { width: 1.2em; text-align: center; font-weight: 700; }
.pw-checks li.ok .ck { color: var(--water); }
.check { display: inline-flex; align-items: center; gap: 10px; min-height: 40px; font-size: 15px; color: var(--ink-soft); cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 0; accent-color: var(--ink); flex: none; }
.check.block { display: flex; align-items: flex-start; gap: 12px; min-height: 0; color: var(--ink); line-height: 1.4; }
.check.block input { width: 22px; height: 22px; margin-top: 1px; }
.consents { display: grid; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); }
.link-btn.inline { padding: 0; text-align: left; }
.privacy { padding-bottom: 8px; }
.privacy h3 { margin: 18px 0 6px; font-weight: 700; font-size: 22px; line-height: 1.15; }
.privacy p { margin: 0 0 8px; }
.privacy ul { margin: 0 0 8px; padding-left: 20px; }
.privacy li { margin: 0 0 6px; }
.privacy ul.dash { list-style-type: "– "; }
.link-in {
  display: inline; padding: 0; margin: 0; border: 0; background: none;
  color: inherit; font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}
.care { margin: -8px 2px 16px; font-size: 14px; color: var(--ink-soft); }
.stat-note.care { margin: 6px 2px 0; }
.note.warn { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--surface-2)); }
.sr-sub.warn { color: var(--danger); }
.owner-users { list-style: none; margin: 0; padding: 0; }
.owner-user {
  display: flex; align-items: center; gap: 10px;
  width: 100%; min-height: 52px; padding: 8px 2px;
  background: none; border: 0; border-bottom: 1px solid var(--line);
  color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.ou-name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ou-flags { flex: none; font-size: 13px; color: var(--ink-soft); }
.ou-flags.bad { color: var(--danger); font-weight: 600; }

.lbl { display: block; font-weight: 600; margin: 0 0 8px; }
.field {
  width: 100%; min-width: 0; min-height: 52px; padding: 0 14px;
  border-radius: 14px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--ink);
  font: 500 17px/1.2 "Barlow", system-ui, sans-serif;
}
.field.big { font-size: 20px; min-height: 58px; }
.field::placeholder { color: var(--ink-soft); opacity: .8; }
.stack { display: grid; gap: 12px; }
.add-inline { display: flex; gap: 8px; }
.btn {
  min-height: 52px; padding: 0 18px;
  border-radius: 14px; border: 1.5px solid var(--ink);
  background: var(--ink); color: var(--bg);
  font-weight: 600; font-size: 17px; line-height: 1.1;
  cursor: pointer; flex: none;
}
.btn.big { min-height: 58px; font-size: 19px; }
.btn.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; }
.link-btn { background: none; border: 0; padding: 10px 0; color: var(--ink-soft); font-size: 16px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; display: block; }

.party-item { display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); }
.party-open {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  min-height: 60px; padding: 10px 2px;
  background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.pi-name { max-width: 100%; font-weight: 600; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pi-sub { font-size: 14px; color: var(--ink-soft); }

/* Alsó lap */
.backdrop { position: fixed; inset: 0; z-index: 20; background: var(--scrim); animation: fade .18s ease-out; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column;
  max-height: 86vh; max-height: 86dvh;
  padding: 4px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); color: var(--ink);
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .28);
  animation: rise .22s ease-out;
}
/* Jelvények: elhomályosított háttér, középen egy kártya */
.backdrop.blur { background: rgba(10, 14, 12, .3); -webkit-backdrop-filter: blur(14px) saturate(.85); backdrop-filter: blur(14px) saturate(.85); }
.sheet.sheet-badges {
  top: 50%; bottom: auto; left: 14px; right: 14px; transform: translateY(-50%);
  max-width: 460px; max-height: 84vh; max-height: 84dvh;
  padding: 6px 18px 20px; border-radius: 26px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
  animation: badgePop .24s ease-out;
}
.sheet.sheet-badges .grab { display: none; }
.badges .soon-tag { margin: 2px 0 10px; }
.badges > p.muted { margin: 0; }
.badge-grid { list-style: none; margin: 18px 0 4px; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 10px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; text-align: center; animation: badgeIn .32s ease-out both; animation-delay: calc(var(--i, 0) * 45ms); }
.b-medal { display: grid; place-items: center; width: 74px; height: 74px; border-radius: 50%; background: var(--surface-2); border: 2px dashed var(--line); color: var(--ink-soft); font-weight: 700; font-size: 30px; line-height: 1; }
.b-medal svg { width: 40px; height: 40px; }
.badge.earned .b-medal { border: 2px solid var(--beer); color: var(--beer); background: var(--surface); box-shadow: 0 4px 14px rgba(0, 0, 0, .14); }
.badge.locked .b-name { color: var(--ink-soft); }
.b-name { max-width: 100%; font-weight: 600; font-size: 14px; line-height: 1.2; overflow-wrap: anywhere; }
.b-desc { font-size: 12px; line-height: 1.25; color: var(--ink-soft); overflow-wrap: anywhere; }
.badge-entry {
  display: flex; align-items: center; gap: 14px; width: 100%; margin: 14px 0 6px; padding: 14px 14px 14px 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.be-medals { display: flex; flex: none; }
.be-medal { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--surface); color: var(--beer); }
.be-medal + .be-medal { margin-left: -12px; }
.be-medal svg { width: 22px; height: 22px; }
.be-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.be-title { font-weight: 700; font-size: 18px; }
.be-sub { font-size: 14px; color: var(--ink-soft); }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 6px auto 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0 6px; }
.sheet-title { margin: 0; font-weight: 700; font-size: 32px; line-height: 1; min-width: 0; overflow-wrap: anywhere; }
.sheet-total { color: var(--c); }
.sheet-vol { font-size: 18px; color: var(--ink-soft); font-weight: 600; }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.drinks { list-style: none; margin: 0; padding: 0; }
.drink { display: flex; align-items: center; gap: 8px; min-height: 58px; border-bottom: 1px solid var(--line); }
.d-name { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.d-name .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.drink.has .nm { font-weight: 600; }
.q-tag { flex: none; font-size: 12px; font-weight: 600; color: var(--c); border: 1px solid var(--c); border-radius: 999px; padding: 1px 7px; }
.d-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.mini {
  width: 46px; height: 46px; border-radius: 12px;
  border: 1.5px solid var(--line); background: transparent; color: var(--ink);
  font-weight: 600; font-size: 26px; line-height: 1; cursor: pointer;
}
.mini-plus { background: var(--c); border-color: var(--c); color: var(--btn-ink); }
.mini:disabled { opacity: .3; cursor: default; }
.d-n { min-width: 2.2ch; text-align: center; font-weight: 700; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.del { width: 36px; height: 36px; border-radius: 10px; border: 0; background: transparent; color: var(--ink-soft); font-size: 22px; cursor: pointer; flex: none; }
.add-row { padding-top: 14px; }
.empty { color: var(--ink-soft); margin: 12px 0; }
.settings { display: grid; gap: 14px; padding-bottom: 4px; }
.settings-sub { margin: 12px 0 0; font-weight: 700; font-size: 24px; }
.settings-sub.first { margin-top: 0; }
.settings p { margin: 0; }
.confirm-text { font-size: 18px; margin: 4px 0 18px; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }

/* Értesítés */
.toast-zone {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  display: flex; justify-content: center;
  padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex; align-items: center; gap: 12px;
  width: 100%; max-width: 528px; min-height: 56px;
  padding: 8px 8px 8px 16px;
  border-radius: 16px; background: var(--ink); color: var(--bg);
  font-weight: 600; box-shadow: 0 8px 30px rgba(0, 0, 0, .3);
  animation: rise .18s ease-out;
}
.toast span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toast button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--bg); color: var(--ink); font-weight: 600; font-size: 15px; cursor: pointer; flex: none; }

/* Alsó sáv és lebegő gombok */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  padding: 0 4px env(safe-area-inset-bottom, 0px);
  background: var(--surface); border-top: 1px solid var(--line);
  box-shadow: 0 -6px 24px rgba(0, 0, 0, .08);
}
.nav-inner { max-width: 560px; height: var(--nav-h); margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.nav-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-width: 0; padding: 6px 2px 4px; border: 0; background: none; color: var(--ink-soft);
  font-size: 12px; font-weight: 600; line-height: 1.1; cursor: pointer;
}
.nav-text { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-ico { width: 34px; height: 30px; display: grid; place-items: center; border-radius: 10px; }
.nav-btn[aria-current="page"] { color: var(--ink); }
.nav-btn[aria-current="page"]:not(.center) .nav-ico { background: var(--surface-2); }
.nav-btn.center .nav-ico {
  width: 62px; height: 62px; margin-top: -30px; border-radius: 50%;
  background: var(--shot); color: var(--btn-ink);
  border: 4px solid var(--surface); box-shadow: 0 6px 16px rgba(0, 0, 0, .22);
}
.nav-btn.center[aria-current="page"] .nav-ico { box-shadow: 0 0 0 2px var(--shot), 0 6px 16px rgba(0, 0, 0, .22); }
.nav-btn.center .nav-text { font-weight: 700; }
.nav-btn[aria-current="page"] .nav-avatar { box-shadow: 0 0 0 2px var(--surface-2), 0 0 0 4px var(--ink); }
.fab, .fab-game { position: fixed; z-index: 14; right: max(16px, calc((100vw - 560px) / 2 + 16px)); cursor: pointer; transition: transform .08s ease-out; }
.fab {
  bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
  width: 62px; height: 62px; border-radius: 50%; border: 0;
  display: grid; place-items: center;
  background: var(--ink); color: var(--bg);
  box-shadow: 0 8px 22px rgba(0, 0, 0, .28);
}
.fab-game {
  bottom: calc(var(--nav-h) + 16px + 62px + 12px + env(safe-area-inset-bottom, 0px));
  min-height: 46px; padding: 0 18px; border-radius: 999px;
  background: var(--surface); color: var(--ink); border: 1.5px solid var(--line);
  font: 700 16px/1 "Barlow", system-ui, sans-serif;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .18);
}
.fab:active, .fab-game:active { transform: scale(.94); }
body.has-nav main { padding-bottom: calc(var(--nav-h) + 110px + env(safe-area-inset-bottom, 0px)); }
body.has-nav .toast-zone {
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding: 0 max(92px, calc((100vw - 560px) / 2 + 92px)) 12px 16px;
}

/* Közös elemek */
.avatar {
  flex: none; display: inline-grid; place-items: center;
  width: 40px; height: 40px; border-radius: 50%;
  font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 19px; line-height: 1; letter-spacing: .02em;
}
.avatar.sm { width: 28px; height: 28px; font-size: 14px; }
.avatar.lg { width: 60px; height: 60px; font-size: 28px; }
.avatar.xl { width: 76px; height: 76px; font-size: 36px; }
.back {
  display: inline-flex; align-items: center; gap: 2px; max-width: 100%;
  min-height: 44px; margin: -6px 0 8px -8px; padding: 0 10px 0 2px;
  border: 0; background: none; color: var(--ink-soft);
  font-size: 16px; font-weight: 600; cursor: pointer;
}
.back span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back-ico { display: grid; }
.card { margin: 0 0 22px; padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.card p { margin: 0 0 14px; }
.eyebrow { margin: 0 0 2px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 15px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 4px; }

/* Kocsma: a „Ma” sáv */
.today { margin: 0 0 24px; }
.today-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; }
.today-head h2 { margin: 0; font-weight: 700; font-size: 38px; line-height: 1; }
.today-date { flex: 1; min-width: 0; color: var(--ink-soft); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.today-more { flex: none; padding: 6px 0; font-size: 15px; }
.today-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { display: flex; flex-direction: column; min-width: 0; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--c); overflow: hidden; }
.tile.quiet { background: transparent; border-style: dashed; border-top-style: solid; }
.tile-open { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; padding: 8px 4px 6px; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
.tile-ico svg { width: 30px; height: 30px; }
.tile-ico { margin: 0 0 2px; }
.tile-num { display: block; font-weight: 700; font-size: 40px; line-height: 1; color: var(--c); font-variant-numeric: tabular-nums; }
.tile-name { font-weight: 600; font-size: 14px; line-height: 1.2; }
.tile-q { max-width: 100%; font-size: 12px; line-height: 1.2; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-plus { margin: 0 6px 6px; min-height: 46px; border: 0; border-radius: 12px; background: var(--c); color: var(--btn-ink); font-weight: 700; font-size: 22px; line-height: 1; cursor: pointer; transition: transform .08s ease-out; }
.tile-plus:active { transform: scale(.94); }
.tile-plus:disabled { opacity: .4; }
.today-hint { margin: 8px 2px 0; font-size: 14px; color: var(--ink-soft); }
.pop { animation: pop .32s ease-out; }
@keyframes pop { 40% { transform: scale(1.25); } }

/* Kocsma: buli */
.party { margin: 0 0 8px; }
.party-head { margin: 0 0 12px; }
.party-head .view-title { overflow-wrap: anywhere; }
.party-head .muted { margin: 2px 0 0; }
.party-foot { display: grid; gap: 4px; margin: 18px 0 0; }
.noparty .btn-row .btn { flex: 1; }
.noparty .btn.wide { margin: 0 0 10px; }
.past { margin: 28px 0 0; }
.party-list { list-style: none; margin: 0; padding: 0; }

/* Profil */
.prof-head { display: flex; align-items: center; gap: 14px; margin: 0 0 4px; }
.prof-text { min-width: 0; }
.prof-head h2 { margin: 0; font-weight: 700; font-size: 40px; line-height: 1.05; overflow-wrap: anywhere; }
.prof-head p { margin: 2px 0 0; }
.days { margin: 26px 0 0; }
.day-list { list-style: none; margin: 0; padding: 0; }
.day-row {
  display: flex; align-items: center; gap: 12px;
  width: 100%; min-height: 64px; padding: 10px 2px;
  background: none; border: 0; border-bottom: 1px solid var(--line);
  color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.dr-date { flex: none; width: 84px; display: flex; flex-direction: column; }
.dr-day { font-weight: 700; font-size: 22px; line-height: 1.05; white-space: nowrap; }
.dr-wd { font-size: 13px; color: var(--ink-soft); }
.dr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.dr-party { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-party.none { font-weight: 500; color: var(--ink-soft); }
.dr-counts { font-size: 14px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-chev, .sr-chev { flex: none; display: grid; color: var(--ink-soft); }
.stat-note.top { margin: 0 2px 6px; }
.settings-list { margin: 30px 0 8px; }
.set-row {
  display: flex; align-items: center; gap: 10px;
  width: 100%; min-height: 58px; padding: 10px 2px;
  background: none; border: 0; border-bottom: 1px solid var(--line);
  color: var(--ink); font: inherit; text-align: left; cursor: pointer;
}
.sr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sr-title { font-weight: 600; font-size: 17px; }
.sr-sub { font-size: 14px; color: var(--ink-soft); }
.set-row.danger .sr-title { color: var(--danger); }
.set-block { display: grid; gap: 8px; padding: 12px 2px 14px; border-bottom: 1px solid var(--line); }

/* Ivós játékok */
.search-wrap { position: relative; margin: 0 0 14px; }
.search-ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); display: grid; color: var(--ink-soft); pointer-events: none; }
.field.search { padding-left: 44px; }
.game-list { display: grid; gap: 10px; }
.game-list > p { margin: 0; }
.game-card {
  display: flex; flex-direction: column; gap: 4px;
  width: 100%; padding: 14px 16px; border-radius: 18px;
  background: var(--surface); border: 1px solid var(--line);
  color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.gc-name { font-weight: 700; font-size: 24px; line-height: 1.1; overflow-wrap: anywhere; }
.gc-meta { font-size: 14px; color: var(--ink-soft); overflow-wrap: anywhere; }
.gc-desc { font-size: 15px; white-space: pre-line; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.field.area { min-height: 120px; padding: 12px 14px; resize: vertical; line-height: 1.4; }
.game-tabs { margin: 0 0 14px; }
.game-tabs .seg-btn { font-size: 15px; line-height: 1.15; padding: 4px 6px; }
.users-care { margin: 0 2px 4px; }
.gc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.gc-tag { flex: none; margin-top: 3px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-soft); font-size: 12px; font-weight: 600; white-space: nowrap; }
.gc-tag.on { border-color: var(--water); color: var(--water); }
.games-sub { margin: 14px 2px 0; font-weight: 700; font-size: 26px; line-height: 1.1; }
.game-list > .games-sub:first-child { margin-top: 4px; }
.gi-meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 16px; }
.gi-meta dt { color: var(--ink-soft); }
.gi-meta dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.game-info .care { margin: 4px 2px 0; }
.gi-desc { margin: 0; font-size: 17px; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; }

/* Naptár, Térkép: hamarosan */
.soon { padding-top: 8px; }
.soon-ico { display: grid; place-items: center; width: 76px; height: 76px; margin: 0 0 16px; border-radius: 24px; background: var(--surface-2); color: var(--ink); }
.soon-ico svg { width: 40px; height: 40px; }
.soon-tag { display: inline-block; margin: 0 0 14px; padding: 3px 12px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; }
.soon-list { margin: 0; padding-left: 20px; color: var(--ink-soft); }
.soon-list li { margin: 0 0 6px; }

/* Felírás lap (+ gomb) és a nap lapja */
.sheet-sub { margin: 0 0 10px; }
.sheet-back { border-color: transparent; margin-left: -6px; }
.sheet-head .sheet-title { flex: 1; }
.pick { margin: 4px 0 18px; }
.pick-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 8px; font-size: 18px; font-weight: 600; }
.pick-total { font-weight: 700; font-size: 26px; line-height: 1; color: var(--c); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: transparent; color: var(--ink);
  font-weight: 600; font-size: 16px; cursor: pointer; transition: transform .08s ease-out;
}
.chip.quick { border-color: var(--c); }
.chip.has { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.chip-n { display: grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--c); color: var(--btn-ink); font-size: 13px; }
.chip.more { color: var(--ink-soft); border-style: dashed; }
.chip:active { transform: scale(.95); }
.chip:disabled { opacity: .5; }
.day-sum { margin: 0 0 12px; }
.day-party { margin: 22px 0 4px; }
.day-party p { margin: 0 0 12px; }
.note.small { margin: 0 0 8px; padding: 8px 12px; font-size: 14px; }
.join .settings-sub { margin-top: 6px; }

/* Kocsma: fejléc, gombok */
.kicon { flex: none; display: block; border-radius: 50%; width: 32px; height: 32px; }
.kicon.md { width: 44px; height: 44px; }
.kicon.lg { width: 56px; height: 56px; }
.kicon.xl { width: 76px; height: 76px; }
.khead { margin: 0 0 22px; padding: 6px 6px 12px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); }
.khead-main {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 72px; padding: 6px 8px;
  background: none; border: 0; border-radius: 16px; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.kh-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.kh-text .eyebrow { margin: 0; }
.kh-name { font-weight: 700; font-size: 30px; line-height: 1.05; overflow-wrap: anywhere; }
.kh-sub { font-size: 14px; color: var(--ink-soft); }
.kh-chev { flex: none; display: grid; color: var(--ink-soft); }
.kbtns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 2px 4px 0; }
.kbtn {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-width: 0; min-height: 62px; padding: 6px 2px; border-radius: 14px;
  border: 1.5px solid var(--line); background: transparent; color: var(--ink);
  font-weight: 600; font-size: 14px; line-height: 1.1; cursor: pointer;
}
.kb-ico { display: grid; }
.kb-text { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kb-badge {
  position: absolute; top: 4px; right: 6px; min-width: 20px; height: 20px; padding: 0 6px;
  display: grid; place-items: center; border-radius: 999px;
  background: var(--shot); color: var(--btn-ink); font-size: 12px; font-weight: 700;
}
.kparty { margin-top: -8px; }
.kparty .feed-title { margin: 0 0 6px; overflow-wrap: anywhere; }
.kparty .muted { margin: 0 0 12px; }
.kmonth { margin: 26px 0 8px; }
.kmonth .feed-title { margin: 0 0 4px; }
.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
.icon-btn.sm { width: 36px; height: 36px; border-radius: 10px; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.month-lbl { flex: 1; text-align: center; font-weight: 600; font-size: 16px; }
.kintro .btn-row .btn { flex: 1; }
.kintro-wait { margin: 0 0 22px; }
.invites .feed-title { margin: 0 0 8px; }
.invite-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.invite-row:first-of-type { border-top: 0; }
.ir-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ir-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ir-sub { font-size: 14px; color: var(--ink-soft); }

/* Barátok */
.friends { margin: 30px 0 0; }
.f-sub { margin: 14px 2px 2px; font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); }
.f-list { list-style: none; margin: 0; padding: 0; }
.f-item { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
.f-open {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 2px;
  background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.f-open.static { cursor: default; }
.friend-box { display: grid; gap: 4px; margin: -4px 0 18px; }
.user-month { margin: 0 0 4px; color: var(--ink-soft); }

/* Kocsma lapok */
.icon-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.icon-pick { display: grid; place-items: center; aspect-ratio: 1; padding: 0; border-radius: 16px; border: 2px solid transparent; background: var(--surface-2); cursor: pointer; }
.icon-pick[aria-checked="true"] { border-color: var(--ink); background: var(--surface); }
.k-list { list-style: none; margin: 0; padding: 0; }
.k-row {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 8px 2px;
  background: none; border: 0; border-bottom: 1px solid var(--line); color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.k-name { flex: 1; min-width: 0; display: flex; flex-direction: column; font-weight: 600; font-size: 18px; overflow-wrap: anywhere; }
.k-sub { font-size: 14px; font-weight: 400; color: var(--ink-soft); }
.k-on { flex: none; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.k-row.on .k-name { font-weight: 700; }
.k-prev { margin: 0; }
.kp-head { display: flex; align-items: center; gap: 12px; margin: 0 0 10px; }
.kp-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.kp-members { list-style: none; margin: 0 0 14px; padding: 0; }
.kp-members li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.code-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.big-code { font-size: 26px; letter-spacing: .08em; }
.owner-msgs { list-style: none; margin: 0; padding: 0; }
.owner-msgs li { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.om-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.om-who { font-size: 13px; color: var(--ink-soft); }
.om-text { white-space: pre-wrap; overflow-wrap: anywhere; }

/* Chat */
.chat-top { margin: 0 0 6px; }
.chat-note { margin: -4px 0 0; }
.chat-list { display: flex; flex-direction: column; gap: 4px; }
.chat-more { align-self: center; }
.chat-empty { margin: 20px 0; text-align: center; }
.chat-day { align-self: center; margin: 14px 0 6px; padding: 3px 12px; border-radius: 999px; background: var(--surface-2); color: var(--ink-soft); font-size: 13px; font-weight: 600; }
.msg { display: flex; align-items: flex-end; gap: 8px; max-width: 100%; margin-top: 6px; }
.msg.grouped { margin-top: 0; }
.msg.mine { justify-content: flex-end; }
.msg-gap { flex: none; width: 28px; }
.bubble {
  display: flex; flex-direction: column; gap: 2px; max-width: min(78%, 420px); min-width: 0;
  padding: 8px 12px 6px; border-radius: 18px 18px 18px 6px;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  font: inherit; text-align: left;
}
button.bubble { cursor: pointer; }
.msg.mine .bubble { border-radius: 18px 18px 6px 18px; background: var(--ink); border-color: var(--ink); color: var(--bg); }
.b-name { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.b-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.35; }
.b-time { align-self: flex-end; font-size: 11px; opacity: .7; }
.composer {
  position: fixed; left: 0; right: 0; z-index: 14;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  max-width: 560px; margin: 0 auto; padding: 8px 16px;
  display: flex; align-items: flex-end; gap: 8px;
  background: var(--bg); border-top: 1px solid var(--line);
}
.chat-input { flex: 1; min-height: 48px; max-height: 140px; padding: 12px 14px; resize: none; line-height: 1.3; }
.chat-send { min-height: 48px; }
body.in-chat main { padding-bottom: calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px)); }
body.in-chat .toast-zone { bottom: calc(var(--nav-h) + 66px + env(safe-area-inset-bottom, 0px)); padding: 0 16px 8px; }
body.chat-typing .nav { display: none; }
body.chat-typing .composer { bottom: var(--kb, 0px); }
body.chat-typing main { padding-bottom: calc(96px + var(--kb, 0px)); }
body.chat-typing .toast-zone { bottom: calc(66px + var(--kb, 0px)); }

/* Alsó sáv: jelzőpötty */
.nav-btn { position: relative; }
.nav-dot { position: absolute; top: 6px; left: calc(50% + 10px); width: 11px; height: 11px; border-radius: 50%; background: var(--shot); border: 2px solid var(--surface); }
.nav-btn.center .nav-dot { top: -26px; left: calc(50% + 18px); }

@keyframes fade { from { opacity: 0; } }
@keyframes badgePop { from { opacity: 0; transform: translateY(-50%) scale(.94); } }
@keyframes badgeIn { from { opacity: 0; transform: scale(.6); } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .fresh, .hero-tally line.draw { stroke-dashoffset: 0; }
  .pop { animation: none; }
}
@media (max-width: 360px) {
  .cat-num { font-size: 44px; }
  .tile-num { font-size: 34px; }
  .nav-text { font-size: 11px; }
  .hero { font-size: 46px; }
  .brand-name { font-size: 26px; }
  .brand-tag { font-size: 13px; }
}
</style>
</head>

  <div class="top-inner">
    <div class="brand-row">
      <div class="brand">
        <svg width="42" height="42" viewBox="0 0 512 512" aria-hidden="true">
          <rect width="512" height="512" rx="112" fill="#18231F"/>
          <path d="M144,380 L144,156 L208,156 L268,272 L328,156 L392,156 L392,380 L338,380 L338,258 L288,352 L248,352 L198,258 L198,380 Z" fill="#F2A24E"/>
          <path d="M124,360 L124,136 L188,136 L248,252 L308,136 L372,136 L372,360 L318,360 L318,238 L268,332 L228,332 L178,238 L178,360 Z" fill="#ECEDE4"/>
        </svg>
        <div class="brand-text">

</button>

</div>
